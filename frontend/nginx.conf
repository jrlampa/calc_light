server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for hashed static assets (JS/CSS chunks)
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* → backend container (strips /api prefix)
    # Normalizamos o Origin para 'http://localhost' antes de repassar ao backend.
    # Isso garante que o FastAPI CORS aceita as chamadas mesmo em domínios de produção,
    # já que o backend fica isolado e só é acessível via este proxy interno.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_redirect     ~^(https?://[^/]+)/(.*)$ $1/api/$2;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Origin            http://localhost;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: serve index.html for all unknown paths (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
