name: CACL LIGHT CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Minimal permissions for all jobs by default
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Python Linting (Ruff)
  # ─────────────────────────────────────────────────────────────
  lint-backend:
    name: Lint Backend (Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.4.4

      - name: Run Ruff
        working-directory: backend
        run: ruff check app/ --config ruff.toml

  # ─────────────────────────────────────────────────────────────
  # Job 2: JavaScript / TypeScript Linting (ESLint)
  # ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # Job 3: Backend Tests (Pytest + Coverage Gate)
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend (Pytest)
    runs-on: ubuntu-latest
    needs: lint-backend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Pytest with Coverage
        working-directory: backend
        run: |
          python -m pytest app/tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ─────────────────────────────────────────────────────────────
  # Job 4: Frontend Unit Tests (Vitest + Coverage Gate)
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend (Vitest)
    runs-on: ubuntu-latest
    needs: lint-frontend
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest with Coverage
        working-directory: frontend
        run: npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ─────────────────────────────────────────────────────────────
  # Job 5: Docker Build Validation
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: cacl-light-backend:ci

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: cacl-light-frontend:ci
