# ruff.toml — Configuração do Linter Python para CACL LIGHT
# Documentação: https://docs.astral.sh/ruff/configuration/

# Versão mínima de compatibilidade do Python
target-version = "py312"

# Comprimento máximo de linha
line-length = 120

# Diretórios e padrões a excluir do linting
exclude = [
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "app/scripts/legacy_importer.py",  # arquivo legado, excluído da auditoria
]

[lint]
# Regras ativas:
# E/W = pycodestyle errors/warnings
# F   = pyflakes (imports não usados, variáveis undefined)
# I   = isort (ordenação de imports)
# UP  = pyupgrade (sintaxe moderna Python)
# B   = flake8-bugbear (padrões problemáticos comuns)
select = ["E", "W", "F", "I", "UP", "B"]

# Regras ignoradas deliberadamente:
# E501 = linha muito longa (gerenciado pelo line-length acima)
# B008 = chamadas de função como valores default (padrão FastAPI Depends)
ignore = ["E501", "B008"]

[lint.isort]
known-first-party = ["app"]
