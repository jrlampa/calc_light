version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - cacl_net

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./database:/database
    environment:
      - DATABASE_URL=sqlite:////database/cacl_light.db
    networks:
      - cacl_net

networks:
  cacl_net:
    driver: bridge
